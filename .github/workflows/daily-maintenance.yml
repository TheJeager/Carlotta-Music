name: Daily Repository Maintenance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-maintenance-dev
  cancel-in-progress: true

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install ruff

      - name: Validate Python syntax
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import pathlib
          import py_compile

          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' in path.parts or '__pycache__' in path.parts:
                  continue
              py_compile.compile(str(path), doraise=True)
          PY

      - name: Fix safe Python issues
        shell: bash
        run: |
          set -e
          ruff check . --select F --ignore F401,F403,F405 --fix
          ruff format .

      - name: Verify real errors
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import pathlib
          import py_compile

          for path in pathlib.Path('.').rglob('*.py'):
              if '.git' in path.parts or '__pycache__' in path.parts:
                  continue
              py_compile.compile(str(path), doraise=True)
          PY
          ruff check . --select F --ignore F401,F403,F405
          python -m pip check

      - name: Report style findings
        shell: bash
        run: |
          ruff check . || true

      - name: Commit automatic fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py' 'requirements.txt'
          if git diff --cached --quiet; then
            echo "No automatic fixes required."
            exit 0
          fi
          git commit -m "chore: daily automatic code maintenance"
          git push origin dev